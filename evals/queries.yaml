- id: q1_spec
  q: "How many job postings across these companies mention Rust?"
  expect_plan:
    op: count
    source_types: [job]
    keyword: rust
  expect_result:
    total: 5
    by_company:
      vercel: 1
      supabase: 4

- id: q1_paraphrase
  q: "count the roles that need rust"
  expect_plan:
    op: count
    source_types: [job]
    keyword: rust

- id: q1_swap_python
  q: "How many job postings mention Python?"
  expect_plan:
    op: count
    source_types: [job]
    keyword: python

- id: q2_spec
  q: "Which company has shipped the most blog posts about databases in the last 6 months?"
  expect_plan:
    op: rank
    source_types: [blog]
    topic: databases
    group_by: company
  expect_result:
    ranking_includes: [vercel, supabase]
    ranking_or_caveat: [hashicorp]

- id: q2_paraphrase
  q: "who blogs most about databases lately"
  expect_plan:
    op: rank
    source_types: [blog]
    topic: databases

- id: q3_spec
  q: "Show me remote engineering roles at Supabase."
  expect_plan:
    op: list
    companies: [supabase]
    source_types: [job]
    filters:
      remote: true
      department: Engineering
  expect_result:
    count: 18
    all_rows_department: Engineering

- id: q3_paraphrase
  q: "list remote eng jobs at supabase"
  expect_plan:
    op: list
    companies: [supabase]
    source_types: [job]

- id: q4_spec
  q: "Compare how Vercel and Supabase talk about their database products."
  expect_plan:
    op: compare
    companies: [vercel, supabase]
    topic: databases

- id: q5_spec
  q: "Which of these companies is most active on GitHub right now?"
  expect_plan:
    op: rank
    source_types: [repo_activity]
    metric: events_7d
    group_by: company

- id: q6_spec
  q: "What new content has come out across these companies in the last 30 days?"
  expect_plan:
    op: timeline
    source_types: [job, blog, repo_activity]
  expect_result:
    showing: 20
    count_min: 100

- id: data_quality_blog_dates
  q: "How many blog posts are in the corpus?"
  expect_plan:
    op: count
    source_types: [blog]
  expect_result:
    blog_null_dates: 0

- id: data_quality_topic_identity
  q: "How many blog posts are in the corpus?"
  expect_plan:
    op: count
    source_types: [blog]
  expect_result:
    topic_no_identity_match: databases

- id: q6_paraphrase
  q: "what's new in the last 30 days across companies"
  expect_plan:
    op: timeline

- id: q_compositional
